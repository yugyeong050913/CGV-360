<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141014">
  <title>좌석 시야 체험 | SCREENX</title>
  <link rel="stylesheet" href="../2D/styles.css">
  <script type="importmap">
    { "imports": { "three": "../2D/vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <main>
    <section class="experience" aria-label="SCREENX 시야 체험">
      <div class="viewer" id="viewer">
        <canvas id="canvas" tabindex="0" aria-label="360도 SCREENX 시야"></canvas>
        <div class="loading" id="loading" role="status">SCREENX 모델 불러오는 중…</div>
      </div>
      <div class="seat-controls">
        <select id="hall" aria-label="상영관" hidden></select>
        <div class="seats" role="group" aria-label="좌석 선택">
          <div class="seat-track" id="seat-track"></div>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
