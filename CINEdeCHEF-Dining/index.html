<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141014">
  <title>CINEdeCHEF Dining</title>
  <link rel="stylesheet" href="../2D/styles.css">
  <script type="importmap">
    { "imports": { "three": "../2D/vendor/three.module.min.js" } }
  </script>
  <link rel="stylesheet" href="./dining.css">
</head>
<body>
  <main>
    <section class="experience" aria-label="CINEdeCHEF 시야 체험">
      <div class="viewer" id="viewer">
        <canvas id="canvas" tabindex="0" aria-label="360도 CINEdeCHEF 시야"></canvas>
        <div class="loading" id="loading" role="status">상영관 준비 중…</div>
      </div>
      <div class="seat-controls">
        <div class="dining-controls" role="group" aria-label="다이닝 메뉴">
          <button type="button" data-step="-1" aria-label="이전 메뉴">‹</button>
          <div aria-live="polite" aria-atomic="true"><strong id="course"></strong><small id="description"></small></div>
          <button type="button" data-step="1" aria-label="다음 메뉴">›</button>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
